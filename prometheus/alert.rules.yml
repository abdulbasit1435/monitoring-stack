groups:
  - name: monitoring_stack_health
    rules:
      - alert: MonitoringTargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Monitoring target is down (instance {{ $labels.instance }})"
          description: "Target {{ $labels.job }} has been unreachable for more than 1 minute."

      - alert: HostDiskFillingUp
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} * 100) < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host disk space running low on {{ $labels.instance }}"
          description: "Available disk space is below 15%."

      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Watchdog heartbeat signal to confirm alert pipeline is alive."
